<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restablecer contraseña | AGRO SHESED</title>
<style>
:root{--navy:#102943;--green:#08733d;--muted:#72808d}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#092843,#11613f);display:grid;place-items:center;padding:24px;color:var(--navy)}main{width:min(100%,460px);background:#fff;border-radius:16px;padding:38px;box-shadow:0 22px 55px #0004}.logo{display:block;width:150px;margin:0 auto 24px}.eyebrow{color:var(--green);font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase}h1{margin:10px 0;font-size:1.8rem}p{color:var(--muted);line-height:1.55}label{display:block;font-weight:700;margin:22px 0 8px}input{width:100%;padding:14px;border:1px solid #d1dbe2;border-radius:9px;font:inherit}.button{width:100%;margin-top:22px;padding:15px;border:0;border-radius:9px;background:var(--green);color:#fff;font-size:1rem;font-weight:700;cursor:pointer}.button:disabled{opacity:.6;cursor:wait}.msg{min-height:24px;margin:16px 0 0}.error{color:#b42318}.success{color:#08733d}.back{display:block;margin-top:25px;color:var(--green);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main>
<img class="logo" src="/assets/logo-original.png" alt="AGRO SHESED">
<div class="eyebrow">Acceso privado</div>
<h1>Crear nueva contraseña</h1>
<p id="intro">Estamos verificando tu enlace seguro de recuperación.</p>
<form id="reset" hidden>
<label>Nueva contraseña<input id="password" type="password" minlength="8" autocomplete="new-password" required></label>
<label>Confirmar contraseña<input id="confirm" type="password" minlength="8" autocomplete="new-password" required></label>
<button class="button">Guardar nueva contraseña</button>
</form>
<p id="msg" class="msg" aria-live="polite"></p>
<a class="back" href="/login">Volver al ingreso</a>
</main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const s=createClient('https://bqtxznjiumensgcnfbnz.supabase.co','sb_publishable_OTSy6t8duo3u6rFWqep1aA_VPCCYBnY');
const q=x=>document.querySelector(x),msg=(x,c='')=>{q('#msg').textContent=x;q('#msg').className='msg '+c};
let recovery=false;
function ready(){recovery=true;q('#intro').textContent='Define una nueva contraseña de al menos 8 caracteres.';q('#reset').hidden=false}
s.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')ready()});
setTimeout(async()=>{const{data:{session}}=await s.auth.getSession();if(!recovery&&session&&location.hash.includes('type=recovery'))ready();if(!recovery)q('#intro').textContent='El enlace no es válido o venció. Solicita uno nuevo desde el administrador.'},900);
q('#reset').onsubmit=async e=>{e.preventDefault();if(!recovery)return;const password=q('#password').value;if(password!==q('#confirm').value)return msg('Las contraseñas no coinciden.','error');const b=e.target.querySelector('button');b.disabled=true;const{error}=await s.auth.updateUser({password});b.disabled=false;if(error)return msg(error.message,'error');msg('Contraseña actualizada. Serás redirigido al ingreso.','success');setTimeout(()=>location.replace('/login'),1400)};
</script>
</body>
</html>
