<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración | AGRO SHESED</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#102943}.app{min-height:100vh;display:grid;grid-template-columns:1.15fr .85fr}.hero{min-height:100vh;display:flex;align-items:center;padding:9%;background:linear-gradient(90deg,#092843ef,#092843a0),url('/assets/banner-1.svg') center/cover}.hero h1{max-width:650px;margin:0;color:#fff;font-size:clamp(2.4rem,4vw,4.4rem);line-height:1.08}.line{width:74px;height:6px;border-radius:8px;background:#16bd70;margin:30px 0}.hero p{max-width:470px;color:#dce8e6;font-size:1.2rem;line-height:1.6}.panel{display:grid;place-items:center;padding:44px;background:#fff}.card{width:min(100%,440px)}.logo{display:block;width:min(240px,62%);margin:0 auto 44px}.eyebrow{color:#147448;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:.78rem}.card h2{margin:12px 0;font-size:2.25rem}.sub{margin:0 0 31px;color:#72808d;font-size:1.05rem}label{display:block;font-weight:700;margin:18px 0 7px}input,textarea{width:100%;padding:15px;border:1px solid #d1dbe2;border-radius:9px;font:inherit;color:#102943}textarea{min-height:95px;resize:vertical}input:focus,textarea:focus{outline:2px solid #a5d7bd;border-color:#147448}.button{width:100%;margin-top:26px;padding:16px;border:0;border-radius:9px;background:#08733d;color:#fff;font-size:1.08rem;font-weight:700;cursor:pointer}.button:hover{background:#075e33}.msg{min-height:23px;margin:15px 0 0}.error{color:#b42318}.ok{color:#08733d}.back{display:block;margin-top:30px;color:#08733d;font-weight:700;text-decoration:none}.admin[hidden],.login[hidden]{display:none!important}.logout{border:0;background:none;padding:0;color:#08733d;font-weight:700;cursor:pointer}@media(max-width:800px){.app{grid-template-columns:1fr}.hero{min-height:310px;padding:44px 9%}.hero h1{font-size:2.35rem}.hero p{font-size:1rem}.panel{min-height:calc(100vh - 310px);padding:42px 26px}.logo{margin-bottom:28px}}</style><main class="app"><section class="hero"><div><div class="eyebrow" style="color:#8fe0b4">AGRO SHESED</div><h1>Cultivamos confianza, protegemos tu operación</h1><div class="line"></div><p>Soluciones integrales para la protección y respaldo de su cultivo, hoy y siempre.</p></div></section><section class="panel"><div class="card"><section id="login" class="login"><img class="logo" src="/assets/logo-original.png" alt="AGRO SHESED"><div class="eyebrow">Acceso privado</div><h2>Bienvenido de nuevo</h2><p class="sub">Ingresa tus datos para acceder a tu cuenta.</p><form id="f"><label>Correo electrónico<input name="email" type="email" placeholder="tu@correo.com" required autocomplete="email"></label><label>Contraseña<input name="password" type="password" placeholder="Ingresa tu contraseña" required autocomplete="current-password"></label><button class="button">Iniciar sesión</button></form><p id="m" class="msg" aria-live="polite"></p><a class="back" href="/">Volver al catálogo</a></section><section id="admin" class="admin" hidden><img class="logo" src="/assets/logo-original.png" alt="AGRO SHESED"><div class="eyebrow">Administración</div><h2>Catálogo</h2><p id="u" class="sub"></p><form id="p"><label>Nombre<input name="name" required></label><label>Categoría<input name="category" required></label><label>Descripción<textarea name="description" required></textarea></label><label>Precio<input name="price" type="number" step="0.01"></label><button class="button">Guardar producto</button></form><p id="pm" class="msg" aria-live="polite"></p><button id="out" class="logout" type="button">Cerrar sesión</button><a class="back" href="/">Ver catálogo público</a></section></div></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const s=createClient('https://bqtxznjiumensgcnfbnz.supabase.co','sb_publishable_OTSy6t8duo3u6rFWqep1aA_VPCCYBnY'),q=x=>document.querySelector(x),msg=(x,c='')=>{q('#m').textContent=x;q('#m').className='msg '+c};async function admin(){let{data:{user}}=await s.auth.getUser();if(!user)return;let{data,error}=await s.from('profiles').select('role,full_name').eq('id',user.id).single();if(error||data.role!='admin'){await s.auth.signOut();return msg('No tiene permisos de administrador.','error')}q('#u').textContent=data.full_name||user.email;q('#login').hidden=true;q('#admin').hidden=false}q('#f').onsubmit=async e=>{e.preventDefault();let d=new FormData(e.target),{error}=await s.auth.signInWithPassword({email:d.get('email'),password:d.get('password')});if(error)return msg(error.message,'error');await admin()};q('#p').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),{error}=await s.from('products').insert({...d,price:d.price||null,active:true});q('#pm').textContent=error?error.message:'Producto guardado';q('#pm').className='msg '+(error?'error':'ok');if(!error)e.target.reset()};q('#out').onclick=async()=>{await s.auth.signOut();q('#admin').hidden=true;q('#login').hidden=false};await s.auth.signOut()</script></html>
