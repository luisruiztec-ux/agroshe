<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración | AGRO SHESED</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px Arial;color:#102943;background:linear-gradient(135deg,#102943,#147448)}main{width:min(420px,90%);padding:32px;background:#fff;border-radius:16px;box-shadow:0 20px 60px #0007}h1{margin:8px 0}p{color:#50646a}label{display:block;margin-top:15px;font-weight:bold}input,textarea{box-sizing:border-box;width:100%;margin-top:6px;padding:12px;border:1px solid #ccd8d1;border-radius:7px;font:inherit}textarea{height:85px}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:7px;background:#147448;color:#fff;font-weight:bold;cursor:pointer}.msg{min-height:22px}.error{color:#b42318}.ok{color:#147448}.link{display:block;margin-top:20px;color:#147448;font-weight:bold;text-decoration:none}#admin[hidden],#login[hidden]{display:none}</style><main><section id="login"><b>AGRO SHESED</b><h1>Acceso administrativo</h1><p>Ingrese para administrar el catálogo.</p><form id="f"><label>Correo<input name="email" type="email" required></label><label>Contraseña<input name="password" type="password" required></label><button>Ingresar</button></form><p id="m" class="msg"></p><a class="link" href="/">Volver al catálogo</a></section><section id="admin" hidden><b>AGRO SHESED</b><h1>Administración</h1><p id="u"></p><h2>Nuevo producto</h2><form id="p"><label>Nombre<input name="name" required></label><label>Categoría<input name="category" required></label><label>Descripción<textarea name="description" required></textarea></label><label>Precio<input name="price" type="number" step="0.01"></label><button>Guardar producto</button></form><p id="pm" class="msg"></p><button id="out">Cerrar sesión</button><a class="link" href="/">Ver catálogo</a></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const s=createClient('https://bqtxznjiumensgcnfbnz.supabase.co','sb_publishable_OTSy6t8duo3u6rFWqep1aA_VPCCYBnY'),q=x=>document.querySelector(x),msg=(x,c='')=>{q('#m').textContent=x;q('#m').className='msg '+c};async function admin(){let{data:{user}}=await s.auth.getUser();if(!user)return;let{data,e}=await s.from('profiles').select('role,full_name').eq('id',user.id).single();if(e||data.role!='admin'){await s.auth.signOut();return msg('No tiene permisos de administrador.','error')}q('#u').textContent=data.full_name||user.email;q('#login').hidden=true;q('#admin').hidden=false}q('#f').onsubmit=async e=>{e.preventDefault();let d=new FormData(e.target),{error}=await s.auth.signInWithPassword({email:d.get('email'),password:d.get('password')});if(error)return msg(error.message,'error');await admin()};q('#p').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),{error}=await s.from('products').insert({...d,price:d.price||null,active:true});q('#pm').textContent=error?error.message:'Producto guardado';q('#pm').className='msg '+(error?'error':'ok');if(!error)e.target.reset()};q('#out').onclick=async()=>{await s.auth.signOut();q('#admin').hidden=true;q('#login').hidden=false};admin()</script></html>
